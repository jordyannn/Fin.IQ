services:
  # ===========================================================================
  # Fin.IQ Next.js Web Application (~120MB RAM) - Connected to Aiven MySQL
  # ===========================================================================
  finiq-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finiq-app
    restart: unless-stopped
    ports:
      # Port 3000 untuk diakses langsung atau melalui reverse proxy Nginx
      - "3000:3000"
      # Jika ingin langsung diakses di port 80 tanpa Nginx, buka baris di bawah:
      # - "80:3000"
    volumes:
      # Mount direktori public agar seluruh aset statis (mascot, icons, sprites) selalu sinkron
      - ./public:/app/public:ro
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Koneksi database langsung ke Aiven MySQL Cloud
      - DATABASE_URL=${DATABASE_URL:-mysql://avnadmin:AVNS_CpIAQBJBbUy_hH9zbT8@finiq-1-jordanngz12-6510.c.aivencloud.com:12551/defaultdb}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-finiq-secret-key-32-chars-minimum-token}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://fin-iq.my.id}
      - NEXT_PUBLIC_DEFAULT_CURRENCY=${NEXT_PUBLIC_DEFAULT_CURRENCY:-IDR}
      - DEMO_USER_ID=${DEMO_USER_ID:-default-user-uuid-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6IGdjST8WXK9I-8LIULXF8TAcbXlz-NeN2H6d1v__yN8A}
      - REDIS_URL=${REDIS_URL:-}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Opsional: Local Redis Cache Container (~20MB RAM)
  # Jalankan: docker compose up -d redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: finiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru

volumes:
  redis-data:
