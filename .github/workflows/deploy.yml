name: Build, Push & Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN dipakai untuk push image ke ghcr.io
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ke ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jordyannn/fin-iq:latest
            ghcr.io/jordyannn/fin-iq:${{ github.sha }}
          # DATABASE_URL cuma dipakai saat `next build` (build-time),
          # tidak masuk ke image final.
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/fin-iq
            export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            git fetch origin main
            git reset --hard origin/main

            kubectl apply -f k8s/

            # Ganti tag image -> memicu rolling update. HPA akan
            # menjaga kalau replika bertambah karena beban.
            kubectl -n finiq set image deployment/finiq-app \
              finiq=ghcr.io/jordyannn/fin-iq:${{ github.sha }}

            kubectl -n finiq rollout status deployment/finiq-app --timeout=300s

            echo "--- pods ---"
            kubectl -n finiq get pods -o wide
            echo "--- hpa ---"
            kubectl get hpa -n finiq
