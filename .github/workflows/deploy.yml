name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/fin-iq
            export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git fetch origin main
            git reset --hard origin/main
            # Hentikan dan hapus container MariaDB lama jika masih ada
            docker compose down --remove-orphans
            docker stop finiq-db 2>/dev/null || true
            docker rm finiq-db 2>/dev/null || true
            # Build dan jalankan finiq-app yang langsung terkoneksi ke Aiven MySQL
            docker compose build --no-cache finiq-app
            docker compose up -d finiq-app
            docker ps
