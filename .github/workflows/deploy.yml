name: Build, Push & Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN dipakai untuk push image ke ghcr.io
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ke ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jordyannn/fin-iq:latest
            ghcr.io/jordyannn/fin-iq:${{ github.sha }}
          # DATABASE_URL cuma dipakai saat `next build` (build-time),
          # tidak masuk ke image final.
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Server TIDAK punya kredensial ghcr (PAT tanpa scope packages),
      # jadi image di-transfer dari runner Actions ke server lewat SSH.
      - name: Pull image di runner
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/jordyannn/fin-iq:${{ github.sha }}
          docker save ghcr.io/jordyannn/fin-iq:${{ github.sha }} -o /tmp/finiq-image.tar

      - name: Kirim image ke server
        uses: appleboy/scp-action@v0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: /tmp/finiq-image.tar
          target: /tmp/
          overwrite: true

      - name: Import image & rollout
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/fin-iq
            export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            git fetch origin main
            git reset --hard origin/main

            # Import ke containerd lokal (tag dipertahankan), jadi k3s
            # pakai image lokal tanpa perlu pull dari ghcr.
            sudo k3s ctr -n k8s.io images import /tmp/finiq-image.tar
            rm -f /tmp/finiq-image.tar

            kubectl apply -f k8s/

            # Ganti tag image -> memicu rolling update. HPA akan
            # menjaga kalau replika bertambah karena beban.
            kubectl -n finiq set image deployment/finiq-app \
              finiq=ghcr.io/jordyannn/fin-iq:${{ github.sha }}

            kubectl -n finiq rollout status deployment/finiq-app --timeout=300s

            echo "--- pods ---"
            kubectl -n finiq get pods -o wide
            echo "--- hpa ---"
            kubectl get hpa -n finiq
