name: Deploy Fin.IQ to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.SERVER_HOST || '43.163.5.111' }}
          username: ${{ secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/fin-iq 2>/dev/null || cd ~/Fin.IQ
            git pull origin main
            docker compose up -d --build
