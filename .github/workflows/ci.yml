name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-key-32-chars-minimum' }}
          DEMO_USER_ID: ${{ secrets.DEMO_USER_ID || '9728be5f-a414-42f3-a827-4504a56c1370' }}
          NEXT_PUBLIC_DEFAULT_CURRENCY: "IDR"
