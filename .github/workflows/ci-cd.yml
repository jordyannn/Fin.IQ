name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 1. Fast Validation for Pull Requests (hemat runner minutes: cek build Next.js tanpa Docker/deploy)
  verify-pr:
    name: Verify PR Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-key-32-chars-minimum' }}
          DEMO_USER_ID: ${{ secrets.DEMO_USER_ID || '9728be5f-a414-42f3-a827-4504a56c1370' }}
          NEXT_PUBLIC_DEFAULT_CURRENCY: "IDR"
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://avnadmin:AVNS_CpIAQBJBbUy_hH9zbT8@finiq-1-jordanngz12-6510.c.aivencloud.com:12551/defaultdb' }}

  # 2. Build, Push ke GHCR & Deploy ke k3s dalam 1 Runner (tanpa re-build berulang dan tanpa runner ganda)
  build-and-deploy:
    name: Build, Push & Deploy to k3s
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jordyannn/fin-iq:latest
            ghcr.io/jordyannn/fin-iq:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL || 'mysql://avnadmin:AVNS_CpIAQBJBbUy_hH9zbT8@finiq-1-jordanngz12-6510.c.aivencloud.com:12551/defaultdb' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Server tidak punya kredensial ghcr -> image di-transfer via SSH & di-import ke containerd
      - name: Pull image di runner
        run: |
          docker pull ghcr.io/jordyannn/fin-iq:${{ github.sha }}

      - name: Kirim image ke server & import ke containerd
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          docker save ghcr.io/jordyannn/fin-iq:${{ github.sha }} | \
            ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -p "${{ secrets.SERVER_PORT || 22 }}" \
                "${{ secrets.SERVER_USERNAME || 'ubuntu' }}@${{ secrets.SERVER_HOST }}" \
                "sudo k3s ctr -n k8s.io images import -"

      - name: Apply manifest & rollout
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/fin-iq
            export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            git fetch origin main
            git reset --hard origin/main

            kubectl apply -f k8s/

            # Ganti tag image -> memicu rolling update
            kubectl -n finiq set image deployment/finiq-app \
              finiq=ghcr.io/jordyannn/fin-iq:${{ github.sha }}

            kubectl -n finiq rollout status deployment/finiq-app --timeout=300s

            echo "--- pods ---"
            kubectl -n finiq get pods -o wide
            echo "--- hpa ---"
            kubectl get hpa -n finiq
