name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 1. Fast Validation for Pull Requests
  verify-pr:
    name: Verify PR Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: cd packages/shared && npx tsc

      - name: Verify Core API Typecheck
        run: cd packages/core-api && npx tsc --noEmit

      - name: Verify AI Service Typecheck
        run: cd packages/ai-service && npx tsc --noEmit

      - name: Run Quality Assurance & Security Tests
        run: npm test

      - name: Verify Next.js Frontend Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-key-32-chars-minimum' }}
          DEMO_USER_ID: ${{ secrets.DEMO_USER_ID || '9728be5f-a414-42f3-a827-4504a56c1370' }}
          NEXT_PUBLIC_DEFAULT_CURRENCY: "IDR"
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://avnadmin:AVNS_CpIAQBJBbUy_hH9zbT8@finiq-1-jordanngz12-6510.c.aivencloud.com:12551/defaultdb' }}
          OPENROUTER: ${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY || '' }}
          GEMINI: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || '' }}

  # 2. Build, Push & Deploy Multi-Microservices ke k3s
  build-and-deploy:
    name: Build, Push & Deploy Microservices to k3s
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build 1: Frontend (Next.js)
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/jordyannn/finiq-frontend:latest
            ghcr.io/jordyannn/finiq-frontend:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL || 'mysql://avnadmin:AVNS_CpIAQBJBbUy_hH9zbT8@finiq-1-jordanngz12-6510.c.aivencloud.com:12551/defaultdb' }}
            OPENROUTER=${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY || '' }}
            GEMINI=${{ secrets.GEMINI || secrets.GEMINI_API_KEY || '' }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY || '' }}
            GEMINI_API_KEY=${{ secrets.GEMINI || secrets.GEMINI_API_KEY || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Build 2: Core API (Express)
      - name: Build & Push Core API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/core-api/Dockerfile
          push: true
          tags: |
            ghcr.io/jordyannn/finiq-core-api:latest
            ghcr.io/jordyannn/finiq-core-api:${{ github.sha }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

      # Build 3: AI Service (Express)
      - name: Build & Push AI Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/jordyannn/finiq-ai-service:latest
            ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      # Pull & tag images di runner
      - name: Pull & tag images di runner
        run: |
          set -euo pipefail
          docker pull ghcr.io/jordyannn/finiq-frontend:${{ github.sha }}
          docker pull ghcr.io/jordyannn/finiq-core-api:${{ github.sha }}
          docker pull ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }}

          # Tag latest juga agar containerd lokal memiliki kedua tag
          docker tag ghcr.io/jordyannn/finiq-frontend:${{ github.sha }} ghcr.io/jordyannn/finiq-frontend:latest
          docker tag ghcr.io/jordyannn/finiq-core-api:${{ github.sha }} ghcr.io/jordyannn/finiq-core-api:latest
          docker tag ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }} ghcr.io/jordyannn/finiq-ai-service:latest

      - name: Kirim image ke server & import ke containerd
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          docker save \
            ghcr.io/jordyannn/finiq-frontend:${{ github.sha }} \
            ghcr.io/jordyannn/finiq-core-api:${{ github.sha }} \
            ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }} | \
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o Compression=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -p "$SERVER_PORT" \
              "${{ secrets.SERVER_USERNAME || 'ubuntu' }}@${{ secrets.SERVER_HOST }}" \
              "sudo k3s ctr -n k8s.io images import -"

      # Verifikasi image di containerd, template manifest, apply & rollout
      - name: Verifikasi containerd, apply manifest & rollout
        uses: appleboy/ssh-action@v1
        env:
          OPENROUTER: ${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY }}
          GEMINI: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: OPENROUTER,GEMINI
          script: |
            set -euo pipefail

            echo "=== 1. Verifikasi Ketersediaan Image di containerd k3s ==="
            REQUIRED_IMAGES=(
              "ghcr.io/jordyannn/finiq-frontend:${{ github.sha }}"
              "ghcr.io/jordyannn/finiq-core-api:${{ github.sha }}"
              "ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }}"
            )

            for img in "${REQUIRED_IMAGES[@]}"; do
              echo "Memeriksa image: $img..."
              verified=0
              for i in $(seq 1 10); do
                if sudo k3s ctr -n k8s.io images list -q | grep -Fq "$img"; then
                  echo "✓ Terverifikasi: $img"
                  verified=1
                  break
                fi
                echo "Menunggu containerd selesai indexing $img (percobaan $i/10)..."
                sleep 3
              done

              if [ "$verified" -eq 0 ]; then
                echo "❌ FATAL: Image $img TIDAK ditemukan di containerd k3s!"
                echo "Membatalkan deployment untuk mencegah ImagePullBackOff."
                exit 1
              fi
            done

            echo "=== 2. Persiapan Manifest Repository ==="
            cd /var/www/fin-iq
            export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            git fetch origin main
            git reset --hard origin/main

            # Bersihkan legacy monolith resources agar NodePort 30080 tidak bentrok dengan service frontend baru
            kubectl -n finiq delete svc finiq --ignore-not-found=true
            kubectl -n finiq delete deploy finiq-app --ignore-not-found=true
            kubectl -n finiq delete hpa finiq --ignore-not-found=true

            # Bersihkan ReplicaSet lama yang tertinggal (pod-nya bisa nyangkut
            # di status Error/ContainerStatusUnknown dan menyesatkan diagnosa)
            kubectl -n finiq get rs | awk 'NR>1 && $2==0 && $3==0 {print $1}' | xargs -r kubectl -n finiq delete rs

            echo "=== 3. Templating Manifest ke Tag SHA (${{ github.sha }}) ==="
            # Template tag SHA langsung ke manifest agar kubectl apply hanya memicu 1 kali rollout (tanpa race condition set image)
            sed -i "s|ghcr.io/jordyannn/finiq-frontend:latest|ghcr.io/jordyannn/finiq-frontend:${{ github.sha }}|g" k8s/frontend/deployment.yaml
            sed -i "s|ghcr.io/jordyannn/finiq-core-api:latest|ghcr.io/jordyannn/finiq-core-api:${{ github.sha }}|g" k8s/core-api/deployment.yaml
            sed -i "s|ghcr.io/jordyannn/finiq-ai-service:latest|ghcr.io/jordyannn/finiq-ai-service:${{ github.sha }}|g" k8s/ai-service/deployment.yaml

            echo "=== 3b. Sync Secrets OPENROUTER & GEMINI ke k3s finiq-secrets ==="
            if [ -n "${OPENROUTER:-}" ]; then
              echo "Patching OPENROUTER & OPENROUTER_API_KEY ke finiq-secrets..."
              kubectl -n finiq patch secret finiq-secrets --type=merge -p "{\"stringData\":{\"OPENROUTER_API_KEY\":\"$OPENROUTER\",\"OPENROUTER\":\"$OPENROUTER\"}}" || \
              kubectl -n finiq create secret generic finiq-secrets --from-literal=OPENROUTER_API_KEY="$OPENROUTER" --from-literal=OPENROUTER="$OPENROUTER" --dry-run=client -o yaml | kubectl apply -f -
            fi
            if [ -n "${GEMINI:-}" ]; then
              echo "Patching GEMINI & GEMINI_API_KEY ke finiq-secrets..."
              kubectl -n finiq patch secret finiq-secrets --type=merge -p "{\"stringData\":{\"GEMINI_API_KEY\":\"$GEMINI\",\"GEMINI\":\"$GEMINI\"}}" || \
              kubectl -n finiq create secret generic finiq-secrets --from-literal=GEMINI_API_KEY="$GEMINI" --from-literal=GEMINI="$GEMINI" --dry-run=client -o yaml | kubectl apply -f -
            fi

            echo "=== 4. Apply Manifests (Atomic Rolling Update) ==="
            kubectl apply -R -f k8s/

            echo "=== 5. Memantau Rollout Status ==="
            kubectl -n finiq rollout status deployment/redis --timeout=120s || true

            for dep in frontend core-api ai-service; do
              echo "Menunggu rollout status deployment/$dep..."
              if ! kubectl -n finiq rollout status deployment/$dep --timeout=300s; then
                echo "❌ ERROR: Rollout deployment/$dep gagal atau timeout!"
                echo "=== Pods status ==="
                kubectl -n finiq get pods -l component=$dep -o wide
                echo "=== Deployment details ==="
                kubectl -n finiq describe deployment $dep
                echo "=== Container logs ==="
                kubectl -n finiq logs -l component=$dep --tail=50 || true
                exit 1
              fi
            done

            echo "=== Fin.IQ Microservices Status ==="
            kubectl -n finiq get pods -o wide
            echo "=== Services & Ports ==="
            kubectl -n finiq get svc
            echo "=== HPA Autoscaler ==="
            kubectl -n finiq get hpa
