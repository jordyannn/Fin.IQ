apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: finiq
  labels:
    app: finiq
    component: ai-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finiq
      component: ai-service
  template:
    metadata:
      labels:
        app: finiq
        component: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-service
          image: ghcr.io/jordyannn/finiq-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: finiq-secrets
          env:
            - name: PORT
              value: "5000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finiq-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finiq-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENROUTER
              valueFrom:
                secretKeyRef:
                  name: finiq-secrets
                  key: OPENROUTER
                  optional: true
            - name: GEMINI
              valueFrom:
                secretKeyRef:
                  name: finiq-secrets
                  key: GEMINI
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: finiq
  labels:
    app: finiq
    component: ai-service
spec:
  type: NodePort
  selector:
    app: finiq
    component: ai-service
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30050
