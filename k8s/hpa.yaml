apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finiq
  namespace: finiq
  labels:
    app: finiq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finiq-app
  minReplicas: 1
  # 3, bukan 5: node cuma ~1.9 GB RAM dan sudah dipakai k3s + Hermes.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # tunggu 5 menit sebelum mengurangi replika, biar tidak flapping
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
