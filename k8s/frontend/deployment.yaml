apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: finiq
  labels:
    app: finiq
    component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finiq
      component: frontend
  template:
    metadata:
      labels:
        app: finiq
        component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/jordyannn/finiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: finiq-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: CORE_API_URL
              value: "http://core-api:4000"
            - name: AI_SERVICE_URL
              value: "http://ai-service:5000"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: finiq
  labels:
    app: finiq
    component: frontend
spec:
  type: NodePort
  selector:
    app: finiq
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
