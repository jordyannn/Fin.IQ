apiVersion: v1
kind: Service
metadata:
  name: finiq
  namespace: finiq
  labels:
    app: finiq
spec:
  # NodePort dipilih karena Nginx + certbot tetap jalan di level VM.
  # Nginx meneruskan traffic ke 127.0.0.1:30080.
  type: NodePort
  selector:
    app: finiq
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
