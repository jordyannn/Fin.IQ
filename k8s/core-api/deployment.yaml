apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: finiq
  labels:
    app: finiq
    component: core-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finiq
      component: core-api
  template:
    metadata:
      labels:
        app: finiq
        component: core-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: core-api
          image: ghcr.io/jordyannn/finiq-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: finiq-secrets
          env:
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: finiq
  labels:
    app: finiq
    component: core-api
spec:
  type: NodePort
  selector:
    app: finiq
    component: core-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30040
