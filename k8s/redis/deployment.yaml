apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: finiq
  labels:
    app: finiq
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: finiq
      component: redis
  template:
    metadata:
      labels:
        app: finiq
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: finiq
  labels:
    app: finiq
    component: redis
spec:
  type: ClusterIP
  selector:
    app: finiq
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
