# Nginx Configuration for Fin.IQ Microservices Reverse Proxy
# Place this at /etc/nginx/sites-available/fin-iq or include in /etc/nginx/conf.d/

# Upstream definitions to K3s NodePort Services
upstream finiq_frontend {
    server 127.0.0.1:30080;
    keepalive 32;
}

upstream finiq_core_api {
    server 127.0.0.1:30040;
    keepalive 32;
}

upstream finiq_ai_service {
    server 127.0.0.1:30050;
    keepalive 16;
}

# Rate limiting zones per IP
limit_req_zone $binary_remote_addr zone=core_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_api_limit:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name fin-iq.my.id www.fin-iq.my.id;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fin-iq.my.id www.fin-iq.my.id;

    # Allow up to 50MB uploads (e-statements, PDFs, spreadsheets)
    client_max_body_size 50M;

    # SSL Certificates (managed via Let's Encrypt certbot)
    ssl_certificate /etc/letsencrypt/live/fin-iq.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin-iq.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Core API Endpoints: /api/v1/*
    location /api/v1/ {
        limit_req zone=core_api_limit burst=20 nodelay;

        proxy_pass http://finiq_core_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI Service Endpoints: /api/ai/*
    location /api/ai/ {
        limit_req zone=ai_api_limit burst=10 nodelay;

        proxy_pass http://finiq_ai_service/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s; # Long timeout for AI completions
    }

    # Next.js Frontend (Catch-all)
    location / {
        proxy_pass http://finiq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
