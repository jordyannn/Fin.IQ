# Nginx Configuration for Fin.IQ Microservices Reverse Proxy
# Place this at /etc/nginx/sites-available/fin-iq or include in /etc/nginx/conf.d/

# Upstream definitions to K3s NodePort Services
upstream finiq_frontend {
    server 127.0.0.1:30080;
    keepalive 32;
}

upstream finiq_core_api {
    server 127.0.0.1:30040;
    keepalive 32;
}

upstream finiq_ai_service {
    server 127.0.0.1:30050;
    keepalive 16;
}

# Map for WebSocket upgrade headers (prevents forcing "upgrade" on regular Next.js HTTP/Server-Action requests)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS resolver configuration (resolves local systemd-resolved and public DNS fallback)
resolver 127.0.0.53 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

# Rate limiting zones per IP
limit_req_zone $binary_remote_addr zone=core_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_api_limit:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name fin-iq.my.id www.fin-iq.my.id _;

    # Allow Let's Encrypt Certbot renewal verification without HTTPS redirect loop
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (uses $host or domain fallback)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name fin-iq.my.id www.fin-iq.my.id 43.163.5.111 _;

    # Allow up to 50MB uploads (e-statements, PDFs, spreadsheets)
    client_max_body_size 50M;

    # SSL Certificates (managed via Let's Encrypt certbot)
    ssl_certificate /etc/letsencrypt/live/fin-iq.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin-iq.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Core API Endpoints: /api/v1/*
    location = /api/v1 {
        return 308 /api/v1/;
    }

    location /api/v1/ {
        limit_req zone=core_api_limit burst=20 nodelay;

        proxy_pass http://finiq_core_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI Service Endpoints: /api/ai/*
    location = /api/ai {
        return 308 /api/ai/;
    }

    location /api/ai/ {
        limit_req zone=ai_api_limit burst=10 nodelay;

        proxy_pass http://finiq_ai_service/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s; # Long timeout for AI completions
    }

    # SSE streaming (frontend)
    location = /api/sse {
        proxy_pass http://finiq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Next.js Frontend (Catch-all)
    location / {
        proxy_pass http://finiq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
